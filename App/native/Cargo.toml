[workspace]
resolver = "2"
members = ["crates/harness-core", "crates/harness-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AI Harness"]
description = "AI Harness — a native, agent-first coding harness."

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
